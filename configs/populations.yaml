        weight: 0.2}

  negotiation:
    cluster_mix: [0.107, 0.536, 0.321, 0.036]
    w_multiplier: [1.0, 1.0]

  fleet:
    ev_count: 20
    # Bias toward smaller-class batteries: Phase 1 fleet was ~24 kWh Leaf +
