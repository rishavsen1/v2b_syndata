# ──────────────────────────────────────────────────────────────────────────
# ACN office-campus re-weightings (campus_10_office, 2026-07-20).
# Same FITTED region_distributions as acn_jpl_baseline / acn_caltech_baseline
# (YAML aliases — the distributions are byte-identical to the calibrated
# blocks). ONLY the axes_distribution weights differ: shifted toward
# regular_charger so fleets behave like office commuters. Raw ACN weights put
# ~36-53% of users in rare_consistent (<10% of days) — too irregular for an
# office-campus scenario. Four regularity tiers
# (regular_charger / occasional_consistent / rare_consistent):
#   veryhigh 0.80 / 0.18 / 0.02   → mean charge freq ≈ 0.56
#   high     0.70 / 0.28 / 0.02   → mean charge freq ≈ 0.51
#   mid      0.55 / 0.40 / 0.05   → mean charge freq ≈ 0.44
#   low      0.40 / 0.50 / 0.10   → mean charge freq ≈ 0.37
# Do NOT run `calibrate` against these entries: the weights are a scenario
# design choice, not a data fit (calibrate would also expand the aliases).
# ──────────────────────────────────────────────────────────────────────────
