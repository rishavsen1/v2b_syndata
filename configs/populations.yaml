# row lacks vehicle_id, the extractor falls back to "inl:port:<evse_id>"
# and flips calibration_metadata.user_id_strategy to "port_proxy".
# Source-args:
#   --source-arg inl:archive_tag=<tag> inl:venue_filter=residential
# ──────────────────────────────────────────────────────────────────────────
inl_residential_legacy:
  description: "INL EV Project Phase 1 (2011-2013) legacy 24 kWh Leaf/Volt residential
    cohort"
  calibration_policy: inl_ev_project

