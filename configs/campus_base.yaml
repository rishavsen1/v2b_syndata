# campus_base.yaml — canonical 10-building base campus config.
#
# Replaces the earlier ad-hoc campus variations. Ten ACN-JPL office buildings
# spanning large→medium office, peaks 600→50 kW, each with 1:1 kWh PV and a
# 2-hour battery (power = capacity/2). Strong per-building weather realization,
# clean output noise. Building-major generation: split with
#   uv run python tools/campus/split_campus_config.py configs/campus_base.yaml
# then run tools/campus/run_campus.sh (SPLIT=configs/_campus_base_split).
output_mode: shared
emit_sessions_soc: true
dr_program: CBP
dr_incentive_per_kw: 13.6
dr_penalty_per_kwh: 6.0
default_policy: ILP-MPCFIXEDFSL
buildings:
# b1 (600-30): large office, peak 600 kW, JPL high-regularity
- base_scenario: S01
  descriptors: {building: large_office_v1, location: san_jose_ca, population: acn_jpl_office_high, equipment: balanced_50pct}
  overrides:
    ev_fleet.ev_count: 30
    charging_infra.charger_count: 30
    pv.dc_capacity_kw: 600
    battery.capacity_kwh: 600
    battery.power_kw: 300
    building_load.peak_kw: 600
    building_load.peak_kw_scaling: true
    user_behavior.soc_chain_enforce: true
  noise_profile: clean
  weather_profile: strong
  seed: 0
# b2 (500-30): large office, peak 500 kW, JPL very-high-regularity
- base_scenario: S01
