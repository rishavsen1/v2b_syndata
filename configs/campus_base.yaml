  overrides:
    ev_fleet.ev_count: 30
    charging_infra.charger_count: 30
    pv.dc_capacity_kw: 500
    battery.capacity_kwh: 500
    battery.power_kw: 250
    building_load.peak_kw: 500
    building_load.peak_kw_scaling: true
    user_behavior.soc_chain_enforce: true
